# A generic, single database configuration.

[alembic]
# path to migration scripts (updated to point to new folder)
script_location = alembic_sqlmodel

# (Optional) keep all other settings the same

# Your DB connection string (update if SQLModel uses a different DB)
; sqlalchemy.url = mysql+pymysql://root:root@localhost:3306/order_management_sqlmodel

sqlalchemy.url = mysql+pymysql://dbuser:dbpassword@localhost:3306/order_management

[post_write_hooks]
# (same as original, can keep or remove)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
